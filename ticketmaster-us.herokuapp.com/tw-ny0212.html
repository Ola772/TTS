<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Events • Ticketmaster</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== MY EVENTS (HOME) ========== */
  #homePage {
    min-height: 100vh;
    background: #000;
    color: white;
  }
  .home-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 16px 8px;
  }
  .home-header h1 { font-size: 18px; font-weight: 700; }
  .home-tabs {
    display: flex;
    border-bottom: 1px solid #333;
    margin-top: 8px;
  }
  .home-tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    font-size: 14px;
    color: #999;
    font-weight: 500;
  }
  .home-tab.active {
    color: white;
    border-bottom: 2px solid white;
  }
  .event-card {
    margin: 16px;
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    cursor: pointer;
  }
  .event-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
  }
  .event-info {
    padding: 14px 16px 18px;
  }
  .event-date {
    font-size: 12px;
    color: #ccc;
    margin-bottom: 6px;
  }
  .event-title {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .event-venue {
    font-size: 13px;
    color: #aaa;
  }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #111;
    display: flex;
    justify-content: space-around;
    padding: 10px 0 24px;
    border-top: 1px solid #222;
  }
  .nav-item {
    text-align: center;
    font-size: 10px;
    color: #888;
  }
  .nav-item.active { color: #026cdf; }
  .nav-item span { display: block; font-size: 20px; margin-bottom: 2px; }

  /* ========== EVENT DETAIL ========== */
  #mainPage { display: none; min-height: 100vh; background: #f5f5f5; padding-bottom: 100px; }

  .header {
    position: relative;
    height: 260px;
    background: #111;
    overflow: hidden;
  }
  .header-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .header-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
  }
  .header-top {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
    color: white;
  }
  .back-btn {
    background: rgba(0,0,0,0.4);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
  }
  .header-content {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    color: white;
    z-index: 5;
  }
  .header-date {
    display: inline-block;
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .header-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .header-venue { font-size: 13px; opacity: 0.9; }
  .ticket-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    z-index: 5;
  }

  .view-tickets-btn {
    display: block;
    margin: -20px 16px 0;
    background: #026cdf;
    color: white;
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 16px;
    border: none;
    width: calc(100% - 32px);
    cursor: pointer;
    position: relative;
    z-index: 10;
    box-shadow: 0 4px 14px rgba(2,108,223,0.35);
  }

  .tabs {
    display: flex;
    background: white;
    margin-top: 16px;
    border-bottom: 1px solid #e5e5e5;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 14px 0;
    font-size: 15px;
    color: #777;
    font-weight: 500;
    position: relative;
  }
  .tab.active { color: #000; font-weight: 700; }
  .tab.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 25%;
    width: 50%;
    height: 3px;
    background: #026cdf;
  }

  .order {
    background: white;
    padding: 14px 16px 10px;
  }
  .order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .order b { font-size: 15px; }
  .order-count { color: #666; font-size: 13px; margin-top: 2px; }

  .edit-btn {
    background: #026cdf;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .ticket-card {
    background: #f7f7f7;
    margin: 8px 16px;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .ticket-type {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .ticket-details {
    display: flex;
    justify-content: space-between;
  }
  .detail-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .detail-value { font-size: 17px; font-weight: 700; }

  .more-options {
    background: white;
    margin-top: 16px;
    padding: 16px;
  }
  .more-options h3 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #333;
  }
  .map-container {
    height: 170px;
    border-radius: 12px;
    overflow: hidden;
    background: #e5e5e5;
  }
  .map-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .get-directions {
    display: block;
    text-align: center;
    margin-top: 12px;
    color: #026cdf;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
  }

  .promo-card {
    background: #111;
    margin: 16px;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    color: white;
  }
  .promo-img {
    width: 110px;
    height: 110px;
    object-fit: cover;
  }
  .promo-content {
    padding: 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .promo-content h4 { font-size: 16px; font-weight: 800; }

  .floating-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border-radius: 50px;
    padding: 6px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.2);
    display: flex;
    z-index: 50;
  }
  .floating-bar button {
    border: none;
    background: none;
    font-weight: 600;
    font-size: 15px;
    color: #333;
    cursor: pointer;
    padding: 12px 26px;
    border-radius: 40px;
  }
  .floating-bar button:first-child { color: #026cdf; }

  /* ========== EDIT MODAL ========== */
  #editModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 200;
    align-items: flex-end;
  }
  #editModal.show { display: flex; }
  .edit-sheet {
    background: white;
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .edit-sheet h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .edit-group {
    margin-bottom: 14px;
  }
  .edit-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 5px;
    color: #444;
  }
  .edit-group input {
    width: 100%;
    padding: 12px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
  }
  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .edit-actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
  .btn-cancel { background: #eee; color: #333; }
  .btn-save { background: #026cdf; color: white; }
  .add-ticket-btn {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: #f0f7ff;
    border: 1.5px dashed #026cdf;
    color: #026cdf;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ========== TRANSFER SHEET ========== */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    z-index: 100;
  }
  #sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 12px 20px 30px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 40px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .sheet-title {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 18px;
  }
  .section-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .seat-grid {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .seat-card {
    width: 90px;
    background: white;
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
  }
  .seat-card.selected {
    border-color: #026cdf;
    background: #f0f7ff;
  }
  .seat-card .seat-label {
    background: #026cdf;
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 0;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .seat-card .circle {
    width: 22px;
    height: 22px;
    border: 2px solid #ccc;
    border-radius: 50%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: white;
  }
  .seat-card.selected .circle {
    background: #026cdf;
    border-color: #026cdf;
  }
  .sheet-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .selected-count { font-size: 14px; color: #666; }
  .transfer-to-btn {
    background: none;
    border: none;
    color: #026cdf;
    font-weight: 700;
    font-size: 15px;
    opacity: 0.4;
    cursor: pointer;
  }
  .transfer-to-btn.active { opacity: 1; }

  /* ========== OTHER PAGES ========== */
  #transferPage, #successPage, #ticketViewPage {
    display: none;
    min-height: 100vh;
    background: white;
  }
  .page-header {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid #eee;
    gap: 12px;
  }
  .page-header .back {
    background: none;
    border: none;
    font-size: 24px;
    color: #026cdf;
    cursor: pointer;
  }
  .page-header h2 { font-size: 18px; font-weight: 700; }
  .transfer-body { padding: 20px 16px; }
  .selected-box {
    background: #f7f7f7;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .input {
    width: 100%;
    padding: 14px 12px;
    border-radius: 10px;
    border: 1.5px solid #ddd;
    font-size: 16px;
  }
  .send-btn {
    width: 100%;
    padding: 16px;
    border: none;
    background: #026cdf;
    color: white;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
    margin-top: 8px;
  }
  #successPage {
    text-align: center;
    padding: 80px 24px;
  }
  .success-icon { font-size: 64px; margin-bottom: 16px; }
  .done-btn {
    background: #026cdf;
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
  }

  .tv-header {
    background: #111;
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tv-header button {
    background: none;
    border: none;
    color: white;
    font-size: 22px;
    cursor: pointer;
  }
  .ticket-slider {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 20px 0;
    gap: 16px;
  }
  .ticket-slider::-webkit-scrollbar { display: none; }
  .single-ticket {
    scroll-snap-align: center;
    background: white;
    border-radius: 16px;
    margin: 0 16px;
    min-width: calc(100% - 32px);
    box-shadow: 0 4px
